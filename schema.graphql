
  # ==================
  # Enums
  # ==================
  enum UserRole {
    SERVICE_USER
    SERVICE_PROVIDER
    ADMIN
    SUPER_ADMIN
  }

  enum AccountStatus {
    PENDING
    ACTIVE
    SUSPENDED
    DEACTIVATED
  }

  enum VerificationStatus {
    UNVERIFIED
    PENDING
    VERIFIED
    REJECTED
  }

  enum BookingStatus {
    PENDING
    ACCEPTED
    REJECTED
    IN_PROGRESS
    COMPLETED
    CANCELLED
    DISPUTED
  }

  enum PaymentStatus {
    PENDING
    PROCESSING
    COMPLETED
    FAILED
    REFUNDED
  }

  enum ServiceStatus {
    DRAFT
    PENDING_APPROVAL
    ACTIVE
    INACTIVE
    SUSPENDED
  }

  enum DisputeStatus {
    OPEN
    UNDER_REVIEW
    RESOLVED
    CLOSED
  }

  enum DisputeResolution {
    REFUND_FULL
    REFUND_PARTIAL
    NO_REFUND
    REDO_SERVICE
    MUTUAL_AGREEMENT
    DISMISSED
  }

  enum ConversationType {
    USER_PROVIDER
    USER_ADMIN
    ADMIN_SUPERADMIN
    BOOKING_RELATED
  }

  enum MessageStatus {
    SENT
    DELIVERED
    READ
  }

  enum NotificationType {
    BOOKING_CREATED
    BOOKING_ACCEPTED
    BOOKING_REJECTED
    BOOKING_CANCELLED
    BOOKING_STARTED
    BOOKING_COMPLETED
    PAYMENT_RECEIVED
    PAYMENT_FAILED
    REFUND_PROCESSED
    REVIEW_RECEIVED
    REVIEW_RESPONSE
    VERIFICATION_APPROVED
    VERIFICATION_REJECTED
    SERVICE_APPROVED
    SERVICE_REJECTED
    SERVICE_SUSPENDED
    DISPUTE_OPENED
    DISPUTE_UPDATED
    DISPUTE_RESOLVED
    NEW_MESSAGE
    ACCOUNT_SUSPENDED
    ACCOUNT_ACTIVATED
    SYSTEM_ANNOUNCEMENT
  }

  # Admin role enum (subset for creation)
  enum AdminRole {
    ADMIN
    SUPER_ADMIN
  }

  # Wallet transaction types
  enum WalletTransactionType {
    CREDIT
    DEBIT
  }

  # Wallet transaction sources
  enum WalletTransactionSource {
    REFUND
    BOOKING_PAYMENT
    SERVICE_EARNING
    WITHDRAWAL
    WITHDRAWAL_REVERSAL
    ADMIN_ADJUSTMENT
    EARNING @deprecated(reason: "Use SERVICE_EARNING")
    PAYOUT @deprecated(reason: "Use WITHDRAWAL")
  }

  # Withdrawal status
  enum WithdrawalStatus {
    PENDING
    PROCESSING
    COMPLETED
    FAILED
    CANCELLED
  }

  # Payout frequency for providers
  enum PayoutFrequency {
    DAILY
    WEEKLY
    BIWEEKLY
    MONTHLY
    MANUAL
    INSTANT @deprecated(reason: "Not supported; use DAILY or MANUAL")
  }

  # Admin actions for audit logging
  enum AdminAction {
    BAN_USER
    UNBAN_USER
    RESTRICT_USER
    UNRESTRICT_USER
    SUSPEND_USER
    ACTIVATE_USER
    PROCESS_WITHDRAWAL
    REJECT_WITHDRAWAL
    PROCESS_REFUND
    RESOLVE_DISPUTE
    ADJUST_WALLET
    UPDATE_USER_ROLE
    DELETE_USER
    VERIFY_PROVIDER
    REJECT_PROVIDER
    APPROVE_SERVICE
    REJECT_SERVICE
    SUSPEND_SERVICE
    UPDATE_PLATFORM_SETTINGS
    RESOLVE_REPORT
    VIEW_REPORTED_CONVERSATION
    CREATE_ADMIN
    DELETE_REVIEW
    REMOVE_RESTRICTION @deprecated(reason: "Use UNRESTRICT_USER")
  }

  # What a report is about
  enum ReportTargetType {
    USER
    MESSAGE
    CONVERSATION
    REVIEW
    SERVICE
    PROVIDER
  }

  enum ReportReason {
    HARASSMENT
    HATE
    SEXUAL_CONTENT
    VIOLENCE
    SCAM
    OFF_PLATFORM_PAYMENT
    SPAM
    IMPERSONATION
    OTHER
  }

  enum ReportStatus {
    OPEN
    ACTIONED
    DISMISSED
  }

  # What an admin decided to do about a report
  enum ModerationAction {
    DISMISS
    # Removes a message, hides a review's text, or suspends a service
    REMOVE_CONTENT
    WARN_USER
    RESTRICT_USER
    BAN_USER
    SUSPEND_SERVICE
  }

  # ==================
  # Types
  # ==================
  
  # Service Provider Profile (embedded in User when role is SERVICE_PROVIDER)
  type ServiceProviderProfile {
    id: ID!
    businessName: String!
    businessDescription: String
    verificationStatus: VerificationStatus!
    address: String!
    city: String!
    state: String!
    country: String!
    latitude: Float
    longitude: Float
    documents: [String!]!
    images: [String!]!
    averageRating: Float
    totalReviews: Int
    likeCount: Int
    isLiked: Boolean
    # Why an admin last rejected verification. Only returned to the provider and admins; null once approved
    rejectionReason: String
    createdAt: String!
    updatedAt: String!
  }

  # Service Category
  type ServiceCategory {
    id: ID!
    name: String!
    slug: String!
    description: String
    icon: String
    isActive: Boolean!
    createdAt: String!
    updatedAt: String!
  }

  # Service
  type Service {
    id: ID!
    provider: ServiceProviderProfile!
    category: ServiceCategory!
    name: String!
    slug: String!
    description: String!
    price: Float!
    duration: Int!
    status: ServiceStatus!
    # Why an admin last sent it back to DRAFT; null once approved. Only returned to the provider and admins
    rejectionReason: String
    # Why an admin suspended it. Only returned to the provider and admins
    suspensionReason: String
    images: [String!]!
    # Distance from the coordinates the caller searched with, in km. Null when
    # the caller sent none, or the provider has no coordinates
    distanceKm: Float
    createdAt: String!
    updatedAt: String!
  }

  # Booking
  type Booking {
    id: ID!
    user: User!
    provider: ServiceProviderProfile!
    service: Service!
    status: BookingStatus!
    scheduledDate: String!
    scheduledTime: String!
    address: String!
    city: String!
    state: String!
    notes: String
    servicePrice: Float!
    commission: Float!
    totalAmount: Float!
    payment: Payment
    review: Review
    completedAt: String
    cancelledAt: String
    cancellationReason: String
    # Customer confirmation and payment release fields
    customerConfirmedAt: String
    paymentReleaseAt: String
    paymentReleasedAt: String
    createdAt: String!
    updatedAt: String!
  }

  # Payment
  type Payment {
    id: ID!
    bookingId: ID!
    amount: Float!
    commission: Float!
    providerPayout: Float!
    status: PaymentStatus!
    paymentMethod: String
    transactionRef: String
    paidAt: String
    refundedAt: String
    # Set when part or all of the payment was refunded to the customer's wallet
    refundAmount: Float
    refundReason: String
    createdAt: String!
    updatedAt: String!
  }

  # Review
  type Review {
    id: ID!
    rating: Int!
    comment: String
    response: String
    # True when moderators hid the review's text. The rating still counts;
    # comment and response are null while hidden.
    isHidden: Boolean!
    respondedAt: String
    createdAt: String!
    updatedAt: String!
    user: ReviewUser
    provider: ReviewProvider
    booking: ReviewBooking
  }

  type ReviewUser {
    id: ID!
    firstName: String!
    lastName: String!
    # Only returned to the reviewer and admins; null for everyone else
    email: String
  }

  type ReviewProvider {
    id: ID!
    businessName: String!
    user: ReviewProviderUser
  }

  type ReviewProviderUser {
    id: ID!
    firstName: String!
    lastName: String!
  }

  type ReviewBooking {
    id: ID!
    scheduledDate: String!
    service: ReviewService
  }

  type ReviewService {
    id: ID!
    title: String!
  }

  # Paginated Reviews
  type PaginatedReviews {
    reviews: [Review!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # Provider Rating Stats
  type ProviderRatingStats {
    averageRating: Float!
    totalReviews: Int!
    fiveStars: Int!
    fourStars: Int!
    threeStars: Int!
    twoStars: Int!
    oneStar: Int!
  }

  # Can Review Response
  type CanReviewResponse {
    canReview: Boolean!
    reason: String
  }

  # ==================
  # Favourite Types
  # ==================

  # Favourite
  type Favourite {
    id: ID!
    createdAt: String!
    service: FavouriteService
  }

  # Service details in favourite
  type FavouriteService {
    id: ID!
    name: String!
    slug: String!
    description: String!
    price: Float!
    duration: Int!
    status: ServiceStatus!
    images: [String!]!
    createdAt: String!
    updatedAt: String!
    category: FavouriteCategory
    provider: FavouriteProvider
  }

  type FavouriteCategory {
    id: ID!
    name: String!
    slug: String!
    icon: String
  }

  type FavouriteProvider {
    id: ID!
    businessName: String!
    verificationStatus: VerificationStatus!
    city: String!
    state: String!
    user: FavouriteProviderUser
  }

  type FavouriteProviderUser {
    id: ID!
    firstName: String!
    lastName: String!
  }

  # Paginated Favourites
  type PaginatedFavourites {
    favourites: [Favourite!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # Is Favourited Response
  type IsFavouritedResponse {
    isFavourited: Boolean!
    favouriteId: ID
  }

  # Toggle Favourite Response
  type ToggleFavouriteResponse {
    isFavourited: Boolean!
    message: String!
  }

  # Service Favourite Count Response
  type ServiceFavouriteCountResponse {
    count: Int!
  }

  # ==================
  # Provider Like Types
  # ==================

  # Provider Like Response
  type ProviderLikeResponse {
    success: Boolean!
    message: String!
    likeCount: Int!
  }

  # Toggle Provider Like Response
  type ToggleProviderLikeResponse {
    success: Boolean!
    message: String!
    isLiked: Boolean!
    likeCount: Int!
  }

  # Is Provider Liked Response
  type IsProviderLikedResponse {
    isLiked: Boolean!
    likeCount: Int!
  }

  # Liked Provider Item
  type LikedProviderItem {
    id: ID!
    likedAt: String!
    provider: LikedProviderDetails!
  }

  # Liked Provider Details
  type LikedProviderDetails {
    id: ID!
    businessName: String!
    businessDescription: String
    verificationStatus: VerificationStatus!
    city: String!
    state: String!
    images: [String!]!
    user: LikedProviderUser
    reviewCount: Int!
    likeCount: Int!
  }

  # Liked Provider User
  type LikedProviderUser {
    id: ID!
    firstName: String!
    lastName: String!
    profilePhoto: String
  }

  # Paginated Liked Providers
  type PaginatedLikedProviders {
    items: [LikedProviderItem!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # ==================
  # Browse / Discovery Types
  # ==================

  # A single provider card returned by browse/nearby queries
  type BrowseProviderItem {
    id: ID!
    businessName: String!
    businessDescription: String
    verificationStatus: VerificationStatus!
    address: String
    city: String!
    state: String!
    country: String!
    latitude: Float
    longitude: Float
    images: [String!]!
    averageRating: Float!
    totalReviews: Int!
    likeCount: Int!
    distanceKm: Float
    categories: [String!]!
    user: BrowseProviderUser
    createdAt: String!
    updatedAt: String!
  }

  type BrowseProviderUser {
    id: ID!
    firstName: String!
    lastName: String!
    profilePhoto: String
  }

  # Active service shown on a provider's full public profile
  type ProviderActiveService {
    id: ID!
    name: String!
    price: Float!
    duration: Int!
    images: [String!]!
    category: ServiceCategory
  }

  # Full public profile of a provider (for the detail page)
  type PublicProviderProfile {
    id: ID!
    businessName: String!
    businessDescription: String
    verificationStatus: VerificationStatus!
    address: String
    city: String!
    state: String!
    country: String!
    latitude: Float
    longitude: Float
    images: [String!]!
    averageRating: Float!
    totalReviews: Int!
    likeCount: Int!
    distanceKm: Float
    categories: [String!]!
    user: BrowseProviderUser
    activeServices: [ProviderActiveService!]!
    createdAt: String!
    updatedAt: String!
  }

  # Paginated browse results
  type PaginatedBrowseProviders {
    items: [BrowseProviderItem!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # Paginated nearby results (includes search metadata)
  type PaginatedNearbyProviders {
    items: [BrowseProviderItem!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    radiusKm: Float!
    # Every provider within this distance (km) is included. Smaller than radiusKm
    # only when the area has too many providers to search at once.
    coveredRadiusKm: Float
    searchLocation: SearchLocation!
  }

  type SearchLocation {
    latitude: Float!
    longitude: Float!
  }

  # ==================
  # Dispute Types
  # ==================

  # Dispute
  type Dispute {
    id: ID!
    reason: String!
    description: String!
    evidence: [String!]!
    status: DisputeStatus!
    raisedByRole: UserRole!
    # User ID of the admin who took the dispute under review; null for everyone but admins
    reviewedBy: ID
    # When an admin took the dispute under review
    reviewStartedAt: String
    resolution: DisputeResolution
    resolutionNotes: String
    refundAmount: Float
    resolvedAt: String
    createdAt: String!
    updatedAt: String!
    booking: DisputeBooking
  }

  type DisputeBooking {
    id: ID!
    status: BookingStatus!
    scheduledDate: String!
    scheduledTime: String!
    servicePrice: Float!
    totalAmount: Float!
    user: DisputeUser
    provider: DisputeProvider
    service: DisputeService
  }

  type DisputeUser {
    id: ID!
    firstName: String!
    lastName: String!
    email: String!
  }

  type DisputeProvider {
    id: ID!
    businessName: String!
    user: DisputeProviderUser
  }

  type DisputeProviderUser {
    id: ID!
    firstName: String!
    lastName: String!
    email: String!
  }

  type DisputeService {
    id: ID!
    name: String!
    price: Float!
  }

  # Paginated Disputes
  type PaginatedDisputes {
    disputes: [Dispute!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # Open Disputes Count Response
  type OpenDisputesCountResponse {
    count: Int!
  }

  # Dispute Statistics
  type DisputeStats {
    total: Int!
    open: Int!
    underReview: Int!
    resolved: Int!
    closed: Int!
    pending: Int!
    resolutions: DisputeResolutionBreakdown
  }

  type DisputeResolutionBreakdown {
    REFUND_FULL: Int
    REFUND_PARTIAL: Int
    NO_REFUND: Int
    REDO_SERVICE: Int
    MUTUAL_AGREEMENT: Int
    DISMISSED: Int
  }

  # Booking Statistics
  type BookingStats {
    totalBookings: Int!
    pendingBookings: Int!
    completedBookings: Int!
    cancelledBookings: Int!
    # providerBookingStats only: the provider's share, after commission and any
    # refund, of paid COMPLETED bookings, whether released yet or still held
    totalRevenue: Float
    # myBookingStats only
    totalSpent: Float
    # providerBookingStats only: completed / all bookings x 100, one decimal place
    completionRate: Float
  }

  # User - unified for SERVICE_USER and SERVICE_PROVIDER
  type User {
    id: ID!
    email: String!
    firstName: String!
    lastName: String!
    phone: String
    profilePhoto: String
    role: UserRole!
    activeRole: UserRole!  # Current active mode (for role switching)
    status: AccountStatus!
    isEmailVerified: Boolean!
    pushEnabled: Boolean!   # Whether push notifications are enabled
    lastLoginAt: String     # ISO timestamp of last login
    # Provider profile is only populated when role is SERVICE_PROVIDER
    providerProfile: ServiceProviderProfile
    createdAt: String!
    updatedAt: String!
  }

  # Active Role Status
  type ActiveRoleStatus {
    currentRole: UserRole!
    activeRole: UserRole!
    canSwitch: Boolean!
    hasProviderProfile: Boolean!
    message: String!
  }

  # Admin User - separate type for clarity
  type AdminUser {
    id: ID!
    email: String!
    firstName: String!
    lastName: String!
    phone: String
    profilePhoto: String
    role: UserRole!
    status: AccountStatus!
    lastLoginAt: String
    createdAt: String!
    updatedAt: String!
  }

  # ==================
  # Response Types
  # ==================

  type AuthResponse {
    user: User!
    accessToken: String!
    refreshToken: String!
  }

  type BecomeProviderResponse {
    user: User!
    accessToken: String!
    refreshToken: String!
  }

  type AdminAuthResponse {
    admin: AdminUser!
    accessToken: String!
    refreshToken: String!
  }

  type RegistrationResponse {
    success: Boolean!
    message: String!
    requiresVerification: Boolean!
  }

  type VerifyEmailResponse {
    success: Boolean!
    message: String!
    user: User
    accessToken: String
    refreshToken: String
  }

  type MessageResponse {
    success: Boolean!
    message: String!
  }

  type VerificationStatusResponse {
    status: VerificationStatus!
    canSubmit: Boolean!
    message: String!
  }

  type RefreshTokenResponse {
    accessToken: String!
    user: User!
  }

  type AdminRefreshTokenResponse {
    accessToken: String!
    admin: AdminUser!
  }

  type PaginatedUsers {
    items: [User!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  type PaginatedAdmins {
    items: [AdminUser!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # Whether a page answers the words that were typed, or the alternatives the
  # search was broadened to after those found nothing
  enum SearchMatchType {
    EXACT
    RELATED
  }

  type PaginatedServices {
    items: [Service!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    # EXACT unless the search fell back to related words. Null on listings that
    # aren't a search (myServices, pendingServices), which are always direct
    matchType: SearchMatchType
    # The term these results came from: what was typed, or the alternatives
    # used when matchType is RELATED. Null when no search term was given
    searchedFor: String
  }

  type ServiceWithDistance {
    id: ID!
    provider: ServiceProviderProfile!
    category: ServiceCategory!
    name: String!
    slug: String!
    description: String!
    price: Float!
    duration: Int!
    status: ServiceStatus!
    images: [String!]!
    distanceKm: Float!
    createdAt: String!
    updatedAt: String!
  }

  type PaginatedNearbyServices {
    items: [ServiceWithDistance!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    radiusKm: Float!
    searchLocation: SearchLocation!
  }

  type PaginatedCategories {
    items: [ServiceCategory!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  type PaginatedBookings {
    items: [Booking!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
  }

  # ==================
  # Input Types - User & Provider (Unified)
  # ==================

  input LoginInput {
    email: String!
    password: String!
  }

  input RegisterUserInput {
    email: String!
    password: String!
    firstName: String!
    lastName: String!
    phone: String
  }

  input VerifyEmailInput {
    email: String!
    otp: String!
  }

  input ResendOtpInput {
    email: String!
  }

  input ForgotPasswordInput {
    email: String!
  }

  input ResetPasswordInput {
    email: String!
    otp: String!
    newPassword: String!
  }

  input UpdateProfileInput {
    firstName: String
    lastName: String
    phone: String
    profilePhoto: String
  }

  input RequestEmailChangeInput {
    newEmail: String!
  }

  input ConfirmEmailChangeInput {
    otp: String!
  }

  input ChangePasswordInput {
    currentPassword: String!
    newPassword: String!
  }

  input PaginationInput {
    page: Int
    limit: Int
  }

  input CreateReportInput {
    targetType: ReportTargetType!
    # ID of the user, message, conversation, review, service or provider profile
    targetId: ID!
    reason: ReportReason!
    # What happened, up to 1000 characters
    details: String
  }

  input ReportFiltersInput {
    status: ReportStatus
    targetType: ReportTargetType
    reason: ReportReason
  }

  input ResolveReportInput {
    action: ModerationAction!
    # Why, for the audit log (at least 5 characters)
    notes: String!
    # Days, 1-365. RESTRICT_USER defaults to 7; BAN_USER without it is permanent
    durationDays: Int
  }

  # Input for upgrading a SERVICE_USER to SERVICE_PROVIDER
  input BecomeProviderInput {
    businessName: String!
    businessDescription: String
    address: String!
    city: String!
    state: String!
    country: String!
    latitude: Float
    longitude: Float
  }

  # Input for updating provider profile
  input UpdateProviderProfileInput {
    businessName: String
    businessDescription: String
    address: String
    city: String
    state: String
    country: String
    latitude: Float
    longitude: Float
    profilePhoto: String
  }

  # ==================
  # Input Types - Service Management
  # ==================

  input CreateServiceInput {
    categoryId: ID!
    name: String!
    description: String!
    price: Float!
    duration: Int!
    images: [String!]
  }

  input UpdateServiceInput {
    categoryId: ID
    name: String
    description: String
    price: Float
    duration: Int
    images: [String!]
    status: ServiceStatus
  }

  input ServiceFiltersInput {
    categoryId: ID
    providerId: ID
    status: ServiceStatus
    minPrice: Float
    maxPrice: Float
    search: String
    city: String
    state: String
    # Geo filter (all three required together to apply)
    latitude: Float
    longitude: Float
    radiusKm: Float
  }

  input NearbyServicesInput {
    latitude: Float!
    longitude: Float!
    radiusKm: Float
    categoryId: ID
    minPrice: Float
    maxPrice: Float
    search: String
    pagination: PaginationInput
  }

  # ==================
  # Input Types - Browse / Discovery
  # ==================

  enum ProviderSortBy {
    RATING_DESC
    POPULARITY_DESC
    NEWEST
    NAME_ASC
    # Nearest first (nearbyProviders only; providers treats it as NEWEST)
    NEAREST
  }

  input ProviderFiltersInput {
    city: String
    state: String
    country: String
    categoryId: ID
    verifiedOnly: Boolean
    minRating: Float
  }

  input BrowseProvidersInput {
    filters: ProviderFiltersInput
    sortBy: ProviderSortBy
    pagination: PaginationInput
  }

  input NearbyProvidersInput {
    latitude: Float!
    longitude: Float!
    radiusKm: Float
    filters: ProviderFiltersInput
    sortBy: ProviderSortBy
    pagination: PaginationInput
  }

  # ==================
  # Input Types - Booking Management
  # ==================

  input CreateBookingInput {
    serviceId: ID!
    scheduledDate: String!
    scheduledTime: String!
    address: String!
    city: String!
    state: String!
    notes: String
  }

  input UpdateBookingInput {
    scheduledDate: String
    scheduledTime: String
